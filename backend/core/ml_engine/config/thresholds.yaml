# ml_engine default thresholds and scoring configuration

z_threshold_flag: 1.5
z_threshold_alert: 2.5
min_persistence_periods: 2
correlation_threshold: 0.5
min_periods_for_trend:
  monthly: 6
  quarterly: 4
  annual: 3

weights:
  magnitude: 30.0
  persistence: 20.0
  trajectory: 20.0
  importance: 15.0
  support: 15.0

classification_cutoffs:
  warning: 25.0
  critical: 50.0
  severe: 75.0
