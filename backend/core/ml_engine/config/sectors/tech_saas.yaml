sector_id: "TECH_SAAS"
sector_name: "Technology / SaaS"
version: "2026-07-01"

metrics:
  - metric_id: "monthly_recurring_revenue_growth"
    display_name: "MRR Growth Rate (%)"
    category: "revenue"
    unit: "percentage"
    valid_min: -100.0
    valid_max: 200.0
    direction: "higher_is_better"
    distribution:
      type: "normal"
      params:
        mean: 8.5
        std: 3.2
        lower_bound: -10.0
        upper_bound: 40.0
    seasonality:
      enabled: true
      period: "quarterly"
      amplitude: 1.2
    size_scaling:
      revenue_bands:
        - band: "<1M"
          mean_adjustment: 3.0
          std_adjustment: 1.5
        - band: "1M-10M"
          mean_adjustment: 0.0
          std_adjustment: 0.0
        - band: "10M-100M"
          mean_adjustment: -2.0
          std_adjustment: -0.5
        - band: ">100M"
          mean_adjustment: -4.0
          std_adjustment: -1.0
    correlation_group: "growth_retention"
    weight: 1.0
    context_tags: ["growth_decline", "topline", "saas_velocity"]

  - metric_id: "churn_rate"
    display_name: "Monthly Churn Rate (%)"
    category: "retention"
    unit: "percentage"
    valid_min: 0.0
    valid_max: 100.0
    direction: "lower_is_better"
    distribution:
      type: "normal"
      params:
        mean: 2.0
        std: 0.8
        lower_bound: 0.1
        upper_bound: 15.0
    seasonality:
      enabled: false
      period: "quarterly"
      amplitude: 0.0
    size_scaling:
      revenue_bands:
        - band: "<1M"
          mean_adjustment: 1.5
          std_adjustment: 0.6
        - band: "1M-10M"
          mean_adjustment: 0.0
          std_adjustment: 0.0
        - band: "10M-100M"
          mean_adjustment: -0.5
          std_adjustment: -0.2
        - band: ">100M"
          mean_adjustment: -1.0
          std_adjustment: -0.3
    correlation_group: "growth_retention"
    weight: 0.95
    context_tags: ["churn_related", "retention_leak", "customer_attrition"]

  - metric_id: "customer_acquisition_cost"
    display_name: "Customer Acquisition Cost ($)"
    category: "sales_efficiency"
    unit: "currency_usd"
    valid_min: 0.0
    valid_max: 1000000.0
    direction: "lower_is_better"
    distribution:
      type: "normal"
      params:
        mean: 4500.0
        std: 1200.0
        lower_bound: 500.0
        upper_bound: 50000.0
    seasonality:
      enabled: false
      period: "quarterly"
      amplitude: 0.0
    size_scaling:
      revenue_bands:
        - band: "<1M"
          mean_adjustment: -1500.0
          std_adjustment: -400.0
        - band: "1M-10M"
          mean_adjustment: 0.0
          std_adjustment: 0.0
        - band: "10M-100M"
          mean_adjustment: 2000.0
          std_adjustment: 600.0
        - band: ">100M"
          mean_adjustment: 5000.0
          std_adjustment: 1500.0
    correlation_group: "unit_economics"
    weight: 0.85
    context_tags: ["cac_inflation", "acquisition_efficiency", "sales_burn"]

  - metric_id: "lifetime_value"
    display_name: "Customer Lifetime Value ($)"
    category: "unit_economics"
    unit: "currency_usd"
    valid_min: 0.0
    valid_max: 10000000.0
    direction: "higher_is_better"
    distribution:
      type: "normal"
      params:
        mean: 22000.0
        std: 6000.0
        lower_bound: 1000.0
        upper_bound: 250000.0
    seasonality:
      enabled: false
      period: "quarterly"
      amplitude: 0.0
    size_scaling:
      revenue_bands:
        - band: "<1M"
          mean_adjustment: -8000.0
          std_adjustment: -2000.0
        - band: "1M-10M"
          mean_adjustment: 0.0
          std_adjustment: 0.0
        - band: "10M-100M"
          mean_adjustment: 15000.0
          std_adjustment: 4000.0
        - band: ">100M"
          mean_adjustment: 40000.0
          std_adjustment: 10000.0
    correlation_group: "unit_economics"
    weight: 0.85
    context_tags: ["ltv_decay", "monetization", "customer_worth"]

  - metric_id: "net_revenue_retention"
    display_name: "Net Revenue Retention (%)"
    category: "retention"
    unit: "percentage"
    valid_min: 0.0
    valid_max: 300.0
    direction: "higher_is_better"
    distribution:
      type: "normal"
      params:
        mean: 110.0
        std: 12.0
        lower_bound: 60.0
        upper_bound: 160.0
    seasonality:
      enabled: false
      period: "quarterly"
      amplitude: 0.0
    size_scaling:
      revenue_bands:
        - band: "<1M"
          mean_adjustment: -5.0
          std_adjustment: -2.0
        - band: "1M-10M"
          mean_adjustment: 0.0
          std_adjustment: 0.0
        - band: "10M-100M"
          mean_adjustment: 4.0
          std_adjustment: 2.0
        - band: ">100M"
          mean_adjustment: 8.0
          std_adjustment: 3.0
    correlation_group: "growth_retention"
    weight: 0.9
    context_tags: ["nrr_drop", "expansion_revenue", "account_health"]

  - metric_id: "burn_rate"
    display_name: "Monthly Burn Rate ($)"
    category: "cash_management"
    unit: "currency_usd"
    valid_min: 0.0
    valid_max: 100000000.0
    direction: "lower_is_better"
    distribution:
      type: "normal"
      params:
        mean: 120000.0
        std: 40000.0
        lower_bound: 5000.0
        upper_bound: 5000000.0
    seasonality:
      enabled: false
      period: "quarterly"
      amplitude: 0.0
    size_scaling:
      revenue_bands:
        - band: "<1M"
          mean_adjustment: -70000.0
          std_adjustment: -20000.0
        - band: "1M-10M"
          mean_adjustment: 0.0
          std_adjustment: 0.0
        - band: "10M-100M"
          mean_adjustment: 300000.0
          std_adjustment: 100000.0
        - band: ">100M"
          mean_adjustment: 1000000.0
          std_adjustment: 300000.0
    correlation_group: "cash_flow"
    weight: 0.8
    context_tags: ["runway_crisis", "burn_spike", "capital_efficiency"]

  - metric_id: "gross_margin"
    display_name: "Gross Margin (%)"
    category: "profitability"
    unit: "percentage"
    valid_min: -100.0
    valid_max: 100.0
    direction: "higher_is_better"
    distribution:
      type: "normal"
      params:
        mean: 75.0
        std: 6.0
        lower_bound: 40.0
        upper_bound: 95.0
    seasonality:
      enabled: false
      period: "quarterly"
      amplitude: 0.0
    size_scaling:
      revenue_bands:
        - band: "<1M"
          mean_adjustment: -4.0
          std_adjustment: -1.0
        - band: "1M-10M"
          mean_adjustment: 0.0
          std_adjustment: 0.0
        - band: "10M-100M"
          mean_adjustment: 2.0
          std_adjustment: 1.0
        - band: ">100M"
          mean_adjustment: 5.0
          std_adjustment: 1.5
    correlation_group: "profitability"
    weight: 0.85
    context_tags: ["margin_compression", "cogs_inflation", "gross_profit"]

correlation_matrix:
  monthly_recurring_revenue_growth:
    churn_rate: -0.65
    net_revenue_retention: 0.78
  churn_rate:
    monthly_recurring_revenue_growth: -0.65
    net_revenue_retention: -0.80
  net_revenue_retention:
    monthly_recurring_revenue_growth: 0.78
    churn_rate: -0.80
    lifetime_value: 0.55
  customer_acquisition_cost:
    burn_rate: 0.60
  burn_rate:
    customer_acquisition_cost: 0.60
  lifetime_value:
    net_revenue_retention: 0.55
