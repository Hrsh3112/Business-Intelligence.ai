[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-ai-backend"
version = "0.1.0"
description = "businessintelligence.ai - full backend (core + enrichment + api)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "httpx>=0.27"
]

[tool.setuptools.package-dir]
ml_engine = "core/ml_engine"
c3_engine = "enrichment/c3_engine"
api = "orchestrator/api"

[tool.pytest.ini_options]
pythonpath = ["core", "enrichment", "orchestrator"]
testpaths = ["core/ml_engine/tests", "enrichment", "orchestrator/api/tests"]
python_files = ["test_*.py"]
